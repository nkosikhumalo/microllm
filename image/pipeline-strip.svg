  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="20" y="18" width="180" height="34" rx="8" fill="#64748B"/><text x="110" y="40" text-anchor="middle" fill="#fff">FP32 checkpoint</text>
